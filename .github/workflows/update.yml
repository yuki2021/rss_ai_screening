name: update-feed

on:
  schedule:
    - cron: "0 21,6 * * *"  # UTC 21:00 = JST 06:00, UTC 06:00 = JST 15:00
  workflow_dispatch:

# The morning run now has two triggers. podcast_auto_player's Cloudflare
# Worker dispatches this workflow at JST 06:05 on weekdays, because GitHub's
# own schedule stopped keeping time in late August 2026 (this workflow ran
# 3, 6, even 11 hours late, and morning_podcast downstream needs custom.xml
# fresh by 06:35). The JST 06:00 cron above is kept anyway: the Worker only
# fires on weekdays, so dropping it would leave weekend mornings with
# Saturday-afternoon data.
#
# Both can therefore fire close together on a morning when GitHub's
# scheduler catches up. That is harmless for compute (public repo), but the
# "Commit RSS" step pushes to main — two concurrent runs race there and one
# dies on a non-fast-forward. Queue them instead of cancelling: a cancelled
# run can be halfway through that push, and the second run wants the first
# one's state.db cache anyway.
concurrency:
  group: update-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: Cache state DB
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: state-db-${{ github.run_id }}
          restore-keys: state-db-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          INOREADER_FEED_URL: ${{ secrets.INOREADER_FEED_URL }}
        run: uv run python -m src.main

      - name: Commit RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/custom.xml public/run_log.jsonl
          git diff --cached --quiet || git commit -m "chore: update feed [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # deploy-pages looks the artifact up exactly once, and GitHub's artifact
      # listing sometimes doesn't show a just-finalized artifact yet: since
      # 2026-11-21, 6 of 15 runs failed with 'Found 0 artifact(s)' /
      # 'No artifacts named "github-pages"' ~0.5 s after a successful upload
      # (actions/deploy-pages#451; the lag has been seen to reach ~46 s).
      # The lookup fails before any deployment is created, so trying again on
      # the same artifact is safe. Re-running the failed job does NOT work:
      # it uploads a second artifact and fails with "Multiple artifacts".
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait for the artifact listing to catch up
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 1)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait longer for the artifact listing
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
